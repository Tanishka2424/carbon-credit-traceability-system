version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: cct_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: carbon_credit_tracer

  backend:
    build: ./backend
    container_name: cct_backend
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      DATABASE_NAME: carbon_credit_tracer
      ALLOWED_ORIGINS: http://localhost:5173
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production_run_openssl_rand_hex_32}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@cct.com}
      MAIL_FROM_NAME: Carbon Credit Tracer
      MAIL_SERVER: smtp.gmail.com
      MAIL_PORT: 587
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:20-alpine
    container_name: cct_frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  mongo_data:
